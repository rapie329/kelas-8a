name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK Release (Split ABI & Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Unduh Dependencies Flutter
        run: flutter pub get

      - name: Compile Split APK per ABI (arm64, armv7, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Salin Split APK ke Folder Rilis
        run: |
          mkdir -p dist_apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist_apk/Kelas8A-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist_apk/Kelas8A-armeabi-v7a.apk

      - name: Compile Universal APK (All-in-One)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist_apk/Kelas8A-Universal.apk

      - name: Unggah File APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kelas8A-APK-Builds
          path: dist_apk/*.apk

      - name: Publikasikan Rilis GitHub Otomatis
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.2
          name: "Kelas 8A v1.0.2 (Tema Laut, Modern iOS 26/27, Mode Guru)"
          body: |
            Aplikasi Kelas 8A Flutter Ultra-Modern iOS 26/27 (Build Rilis Resmi)
            - Tata letak baru: Dynamic Island Capsule, modern 22px curved glassmorphic cards
            - Tema Warna Apple Baru: 🌊 Tema Laut (Ocean Blue), 🔵 Biru Klasik, 🔴 Merah Ruby, 🌸 Sakura Pink, 💜 Lavender
            - Fitur Beranda Baru: Jadwal Hari Ini aktif, Piket Kebersihan harian, dan Portal Login Guru / Wali Kelas
            - Support Android 9 sampai Android 16 (API 28 - API 35+)
            - Signed dengan RSA 2048 Release Key resmi (V1 + V2 + V3 Signature)
            - Ikon otentik Apple iOS Squircle
            - Tersedia varian Split ABI untuk hemat memori:
              * Kelas8A-arm64-v8a.apk (Disarankan untuk 99% HP Android modern)
              * Kelas8A-armeabi-v7a.apk (Untuk HP Android 32-bit lama)
              * Kelas8A-Universal.apk (Universal / Cocok untuk semua HP)
              * Kelas8A-Universal.apk (Universal / Cocok untuk semua HP)
          files: dist_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
